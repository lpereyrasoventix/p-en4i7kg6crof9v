<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovation Day 2026 · Herbie en AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Poppins:wght@600&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root { --cream:#FAFAF5; --teal:#1A6E64; --teal-l:#2E938A; --amber:#E4972E; --gray:#6E6E68; --hair:#C9DAD6; }
* { box-sizing:border-box; }
html, body { margin:0; overflow-x:hidden; height:100%; background:var(--cream); color:var(--teal); font-family:Montserrat, Arial, sans-serif; }
body { display:flex; flex-direction:column; min-height:100svh; }
header { padding:22px 20px 0; text-align:center; }
.kicker { font-size:11px; letter-spacing:.35em; color:var(--teal-l); font-weight:600; text-transform:uppercase; }
h1 { margin:8px 0 4px; font-size:26px; font-weight:800; line-height:1.1; }
h1 span { color:var(--amber); }
.rule { width:48px; height:3px; background:#C7941A; margin:10px auto 0; }
model-viewer { flex:1; width:100%; min-height:360px; background:radial-gradient(circle at 50% 60%, #fff 0%, var(--cream) 70%); }
.ar-btn { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); border:0; border-radius:999px; background:var(--teal); color:#fff;
  font:600 16px Montserrat, sans-serif; padding:15px 26px; box-shadow:0 6px 18px rgba(26,110,100,.35); white-space:nowrap; }
.hint { text-align:center; font-size:13px; color:var(--gray); padding:0 24px 8px; line-height:1.45; }
footer { display:flex; justify-content:center; align-items:center; gap:10px; padding:12px 0 18px; }
footer img { height:18px; }
footer .bar { width:1px; height:18px; background:var(--hair); }
footer b { font-family:Poppins, sans-serif; font-weight:600; font-size:14px; }
</style>
</head>
<body>
<header>
  <div class="kicker">Innovation Day 2026</div>
  <h1>Herbie llegó <span>a tu mesa</span></h1>
  <div class="rule"></div>
</header>

<model-viewer id="mv" src="herbie.glb" alt="Herbie 53 flotando"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
  camera-controls autoplay animation-name="Flotar" shadow-intensity="0.8" shadow-softness="1"
  exposure="1.05" environment-image="neutral" camera-orbit="35deg 70deg auto">
  <button slot="ar-button" class="ar-btn">Ver en realidad aumentada</button>
</model-viewer>

<p class="hint" id="hint">Toca el botón y apunta la cámara a una mesa o al piso. Herbie aparecerá flotando frente a ti.</p>

<footer>
  <img src="soventix-teal.png" alt="soventix"><span class="bar"></span><b>I+D+i</b>
</footer>

<script>
// Si el equipo no admite realidad aumentada, se ve el modelo 3D en pantalla y se ajusta el texto
const mv = document.getElementById('mv');
mv.addEventListener('load', () => {
  if (!mv.canActivateAR) {
    document.getElementById('hint').textContent = 'Gira a Herbie con el dedo o el ratón. Para verlo en realidad aumentada, abre esta página desde un celular.';
  }
});
</script>
</body>
</html>
