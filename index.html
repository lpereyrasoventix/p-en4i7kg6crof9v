<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Innovation Day 2026 · Herbie</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
html, body { margin:0; height:100%; overflow:hidden; background:#000; font-family:Montserrat, Arial, sans-serif; }
#ar { position:fixed; inset:0; }
.tag { position:fixed; left:50%; top:max(16px, env(safe-area-inset-top)); transform:translateX(-50%); z-index:10;
  background:rgba(250,250,245,.92); color:#1A6E64; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:600;
  white-space:nowrap; box-shadow:0 4px 14px rgba(0,0,0,.25); transition:opacity .4s; }
.tag b { color:#E4972E; font-weight:800; }
.err { display:none; position:fixed; inset:0; z-index:20; background:#FAFAF5; color:#1A6E64; text-align:center; padding:40px 28px; box-sizing:border-box; }
.err h2 { font-weight:800; margin:60px 0 12px; }
.err p { color:#6E6E68; line-height:1.5; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
</head>
<body>
<div id="ar"></div>
<div class="tag" id="tag">Apunta la cámara a <b>tu tarjeta</b></div>
<div class="err" id="err">
  <h2>Necesitamos la cámara</h2>
  <p>Para ver a Herbie, permite el acceso a la cámara y vuelve a escanear el código de tu tarjeta.</p>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MindARThree } from 'mindar-image-three';

// Centro del QR respecto al centro de la tarjeta (ancho de la tarjeta = 1)
const QR = { x: 0, y: 0.0185, size: 0.615 };

const mindar = new MindARThree({
  container: document.getElementById('ar'),
  imageTargetSrc: 'targets.mind',
  uiScanning: 'no', uiLoading: 'yes',
  filterMinCF: 0.0001, filterBeta: 0.001,   // suaviza el temblor
});
const { renderer, scene, camera } = mindar;
renderer.outputColorSpace = THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.5, 1, 2);
scene.add(sun);

const anchor = mindar.addAnchor(0);

// Sombra suave sobre el QR
const c = document.createElement('canvas'); c.width = c.height = 128;
const g = c.getContext('2d');
const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
grad.addColorStop(0, 'rgba(0,0,0,.45)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
shadow.position.set(QR.x, QR.y, 0.002);
anchor.group.add(shadow);

// Herbie: pivote sobre el centro del QR, gira alrededor del eje perpendicular a la tarjeta
const pivot = new THREE.Group();
pivot.position.set(QR.x, QR.y, 0.15);
anchor.group.add(pivot);
const upright = new THREE.Group();
upright.rotation.x = Math.PI / 2;      // el "arriba" del carro apunta hacia fuera de la tarjeta
pivot.add(upright);

new GLTFLoader().load('herbie.glb', (gltf) => {
  const car = gltf.scene;
  const root = car.getObjectByName('Herbie');
  if (root) root.position.set(0, 0, 0);
  car.scale.setScalar(1.15);
  car.position.y = -0.03;
  upright.add(car);
});

anchor.onTargetFound = () => { document.getElementById('tag').style.opacity = 0; };
anchor.onTargetLost = () => { document.getElementById('tag').style.opacity = 1; };

const clock = new THREE.Clock();
try {
  await mindar.start();
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime();
    pivot.rotation.z = t * 0.55;                       // una vuelta cada ~11 s
    pivot.position.z = 0.15 + 0.03 * Math.sin(t * 1.6); // flota
    const s = 0.62 - 0.12 * Math.sin(t * 1.6);
    shadow.scale.set(s, s * 0.8, 1);
    renderer.render(scene, camera);
  });
} catch (e) {
  document.getElementById('err').style.display = 'block';
  document.getElementById('tag').style.display = 'none';
}
</script>
</body>
</html>
