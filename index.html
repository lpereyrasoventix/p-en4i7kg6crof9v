<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Innovation Day 2026 · Herbie</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
html, body { margin:0; height:100%; overflow:hidden; background:#000; font-family:Montserrat, Arial, sans-serif; }
#ar { position:fixed; inset:0; }
.tag { position:fixed; left:50%; bottom:max(28px, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:10;
  background:rgba(250,250,245,.94); color:#1A6E64; border-radius:999px; padding:11px 20px; font-size:14px; font-weight:600;
  white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.28); transition:opacity .5s, transform .5s; }
.tag b { color:#E4972E; font-weight:800; }
.tag.off { opacity:0; transform:translate(-50%, 12px); }
.brand { position:fixed; top:max(16px, env(safe-area-inset-top)); left:0; right:0; text-align:center; z-index:10;
  color:#fff; font-size:11px; letter-spacing:.35em; font-weight:600; text-shadow:0 1px 6px rgba(0,0,0,.6); }
.err { display:none; position:fixed; inset:0; z-index:20; background:#FAFAF5; color:#1A6E64; text-align:center; padding:40px 28px; box-sizing:border-box; }
.err h2 { font-weight:800; margin:60px 0 12px; }
.err p { color:#6E6E68; line-height:1.5; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
</head>
<body>
<div id="ar"></div>
<div class="brand">INNOVATION DAY 2026 · I+D+i</div>
<div class="tag" id="tag">Apunta la cámara a <b>tu tarjeta</b></div>
<div class="err" id="err">
  <h2>Necesitamos la cámara</h2>
  <p>Para ver a Herbie, permite el acceso a la cámara y vuelve a escanear el código de tu tarjeta.</p>
</div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import { setupLighting, buildStage } from './stage.js';

// Centro del QR respecto al centro de la tarjeta (ancho de la tarjeta = 1)
const QR = { x: 0, y: 0.0185 };

const mindar = new MindARThree({
  container: document.getElementById('ar'),
  imageTargetSrc: 'targets.mind',
  uiScanning: 'no', uiLoading: 'yes',
  filterMinCF: 0.0001, filterBeta: 0.001,   // suaviza el temblor
});
const { renderer, scene, camera } = mindar;
setupLighting(renderer, scene);

const anchor = mindar.addAnchor(0);
const stage = buildStage(QR, 'bochito.glb');
anchor.group.add(stage.root);

const tag = document.getElementById('tag');
anchor.onTargetFound = () => { stage.show(); tag.classList.add('off'); };
anchor.onTargetLost = () => { stage.hide(); tag.classList.remove('off'); };

const clock = new THREE.Clock();
try {
  await mindar.start();
  renderer.setAnimationLoop(() => {
    stage.update(clock.getElapsedTime());
    renderer.render(scene, camera);
  });
} catch (e) {
  document.getElementById('err').style.display = 'block';
  tag.style.display = 'none';
}
</script>
</body>
</html>
